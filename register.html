<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - MotoVerse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
<div class="auth-container"><div class="auth-box">
<a href="index.html" class="logo">🏍️ Moto<span>Verse</span></a>
<h1>Create Account</h1><p>Join the MotoVerse community.</p>
<form id="registerForm">
<div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Enter your name"><small id="nameError"></small></div>
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="Enter your email"><small id="emailError"></small></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Create a password"><small id="passwordError"></small></div>
<div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm password"><small id="confirmError"></small></div>
<div class="form-group"><label><input type="checkbox" id="terms"> I agree to the terms and conditions.</label><small id="termsError"></small></div>
<button type="submit" class="btn primary-btn full-btn">Create Account</button>
</form>
<p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p>
<a href="index.html">← Back to website</a>
</div></div>
<script src="js/validation.js"></script>
</body>
</html>
