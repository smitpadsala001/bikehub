<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MotoVerse</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
<div class="auth-container"><div class="auth-box">
<a href="index.html" class="logo">🏍️ Moto<span>Verse</span></a>
<h1>Welcome Back</h1><p>Login to your MotoVerse account.</p>
<form id="loginForm">
<div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="Enter your email"><small id="loginEmailError"></small></div>
<div class="form-group"><label>Password</label><div class="password-box"><input type="password" id="loginPassword" placeholder="Enter your password"><button type="button" id="showPassword">👁</button></div><small id="loginPasswordError"></small></div>
<button type="submit" class="btn primary-btn full-btn">Login</button>
</form>
<p class="auth-bottom">Don't have an account? <a href="register.html">Create Account</a></p>
<a href="index.html">← Back to website</a>
</div></div>
<script src="js/validation.js"></script>
</body>
</html>
